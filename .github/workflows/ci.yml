name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
          - 20
          - 22
          - 24
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - node: 10
            os: macOS-latest
          - node: 12
            os: macOS-latest
          - node: 14
            os: macOS-latest
        include:
          - arch: x86
            node: 10
            os: windows-latest
          - arch: x86
            node: 12
            os: windows-latest
          - arch: x86
            node: 14
            os: windows-latest
          - arch: x86
            node: 16
            os: windows-latest
          - arch: x86
            node: 20
            os: windows-latest
          - arch: x86
            node: 22
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: ./package.json
      - name: Pin npm registry to the release-date time machine
        run: |
          npm config set registry https://:2025-06-28T13%3A28%3A38.606000Z@time-machines-npm.sealsecurity.io/
        shell: bash
      - run: npm install
      - run: npm test
      - run: npm pack
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 22 && matrix.arch ==
          'x64'
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 22 && matrix.arch ==
          'x64'
        with:
          name: npm-tarball
          path: ws-*.tgz
          if-no-files-found: error
